name: Train, Evaluate, Deploy Federated QoS Decision Model

on:
  push:
    branches: [main]

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: iot-reliability
        run: pip install -r requirements.txt

      - name: Train and evaluate (reproduces results + exports deployable models)
        working-directory: iot-reliability
        run: python scripts/train_and_evaluate.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        working-directory: iot-reliability
        run: sam build

      - name: SAM deploy
        working-directory: iot-reliability
        run: |
          sam deploy \
            --stack-name iot-reliability \
            --region "${{ secrets.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
