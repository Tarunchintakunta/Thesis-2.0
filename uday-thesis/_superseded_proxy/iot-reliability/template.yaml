AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Federated QoS Offload Decision Pipeline - Kinesis and Lambda

Resources:
  QoSTelemetryStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: QoSTelemetryStream
      ShardCount: 1

  DecisionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaKinesisExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  QoSDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FederatedQoSDecisionFunction
      CodeUri: src/lambda_handler/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt DecisionFunctionRole.Arn
      Events:
        StreamEvent:
          Type: Kinesis
          Properties:
            Stream: !GetAtt QoSTelemetryStream.Arn
            StartingPosition: LATEST
            BatchSize: 100

Outputs:
  TelemetryStreamName:
    Description: "Kinesis Stream for raw QoS telemetry ingestion"
    Value: !Ref QoSTelemetryStream
  DecisionFunction:
    Description: "Lambda Function for federated offload-decision inference"
    Value: !Ref QoSDecisionFunction
