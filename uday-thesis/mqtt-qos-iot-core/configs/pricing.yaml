  usd_per_million_rules_triggered: 0.15
  usd_per_million_rule_actions: 0.15

lambda:
  usd_per_million_requests: 0.20
  usd_per_gb_second: 0.0000166667
  assumed_memory_mb: 128
  assumed_duration_ms: 20

dynamodb:
  usd_per_million_wru: 1.25

free_tier_monthly:
  iot_messages: 250000
  iot_minutes: 750000
  lambda_requests: 1000000
  dynamodb_wru: 2500000
