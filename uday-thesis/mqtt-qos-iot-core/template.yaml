# Optional SAM twin of the Terraform scaffold (not applied this pass).
# Project tags only. Keep Free-Tier-safe: on-demand DynamoDB, 128 MB Lambda.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: mqtt-qos-iot-core IoT Core rules → Lambda → DynamoDB (formal CA2)

Parameters:
  ProjectName:
    Type: String
    Default: mqtt-qos-iot-core

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tags:
      Project: !Ref ProjectName
      Thesis: uday-mqtt-qos
      Environment: research
      ManagedBy: sam

Resources:
  DeliveredTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-delivered'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: msg_id
          AttributeType: S
        - AttributeName: delivery_id
          AttributeType: S
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: msg_id
          KeyType: HASH
        - AttributeName: delivery_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: run_id-index
          KeySchema:
            - AttributeName: run_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Thesis
          Value: uday-mqtt-qos

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ingest'
      CodeUri: ../src/lambda_ingest/
      Handler: handler.handler
      Environment:
        Variables:
          DELIVERED_TABLE: !Ref DeliveredTable
          TTL_SECONDS: '1209600'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeliveredTable

  # IoT topic rule is easier to manage in Terraform for this thesis; SAM documents the Lambda+DDB pair.

Outputs:
  DeliveredTableName:
    Value: !Ref DeliveredTable
  IngestFunctionName:
    Value: !Ref IngestFunction
