AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PROXY unused Kinesis/Lambda SAM stub — NOT the formal CA2 AWS method (K8s on EC2+S3+CloudWatch). Do not deploy this pass.

Resources:
  WorkloadTelemetryStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: WorkloadTelemetryStream
      ShardCount: 1

  ScalingFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaKinesisExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PAKSScalingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PAKSStabilityAwareScalingFunction
      CodeUri: src/lambda_handler/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt ScalingFunctionRole.Arn
      Events:
        StreamEvent:
          Type: Kinesis
          Properties:
            Stream: !GetAtt WorkloadTelemetryStream.Arn
            StartingPosition: LATEST
            BatchSize: 100

Outputs:
  TelemetryStreamName:
    Description: "Kinesis Stream for raw workload telemetry ingestion"
    Value: !Ref WorkloadTelemetryStream
  ScalingFunction:
    Description: "Lambda Function for stability-aware predictive scaling decisions"
    Value: !Ref PAKSScalingFunction
