name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  anji-sqs-reliability:
    name: anji / sqs-reliability-recovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anji-thesis/sqs-reliability-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anji-thesis/sqs-reliability-recovery/requirements-dev.txt
      - name: install
        run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check src tests analysis scripts
      - name: unit + integration tests
        run: python -m pytest
      - name: sam template lint
        run: cfn-lint template.yaml
      - name: stats self-check
        run: python analysis/stats_tests.py --self-check
      - name: dry-run pilot smoke test
        run: DRY_RUN=1 python -m src.control.experiment_runner --config configs/pilot.yaml --out /tmp/pilot --quiet

  kasi-log-anomaly:
    name: kasi / serverless-log-anomaly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasi-thesis/serverless-log-anomaly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kasi-thesis/serverless-log-anomaly/requirements-dev.txt
      - name: install
        run: pip install -r requirements-dev.txt && pip install -e .
      - name: fetch loghub bgl sample (checksum verified)
        run: scripts/fetch_loghub.sh
      - name: lint
        run: ruff check src tests infra
      - name: tests (unit + smoke pipeline + moto)
        run: python -m pytest
      - name: sam template lint
        run: cfn-lint infra/lambda_app/template.yaml
      - name: smoke run of the whole pipeline
        run: make smoke PY=python

  chaitanya-coldstart:
    name: chaitanya / lambda-coldstart-isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaitanya-thesis/lambda-coldstart-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chaitanya-thesis/lambda-coldstart-isolation/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: chaitanya-thesis/lambda-coldstart-isolation/functions/java/*/pom.xml
      - name: install
        run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check src tests scripts
      - name: unit + integration tests
        run: python -m pytest
      - name: sam template lint
        run: cfn-lint infra/template.yaml
      - name: build the six deployment packages
        run: PY=python bash scripts/package_all.sh
      - name: runtime gate (same digest in every runtime and package)
        run: python scripts/check_digests.py --require python,nodejs,java
      - name: init proxy smoke run
        run: python scripts/local_init_bench.py --reps 2 --warmup 1 --out /tmp/bench_smoke
      - name: whole pipeline on mock data
        run: make mock-all PY=python
      - name: citation gate (offline part)
        run: python scripts/check_bib.py --offline

  rassool-dynamodb:
    name: rassool / dynamodb-pk-capacity-eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rassool-thesis/dynamodb-pk-capacity-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rassool-thesis/dynamodb-pk-capacity-eval/requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false
      - name: install
        run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check workloads tests analysis scripts
      - name: unit + moto integration tests
        run: python -m pytest
      - name: terraform fmt + validate
        run: |
          cd iac
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: committed design checks and tfvars match the code
        run: |
          python analysis/design_checks.py > /dev/null
          python scripts/render_tfvars.py
          git diff --exit-code analysis/design_checks iac/terraform.tfvars.json
      - name: citation check (offline part)
        run: python scripts/check_bib.py --offline
      - name: smoke run on in-memory DynamoDB (moto)
        run: make smoke PY=python

  vikas-idempotency:
    name: vikas / lambda-idempotency-eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vikas-thesis/lambda-idempotency-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vikas-thesis/lambda-idempotency-eval/requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false
      - name: install
        run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check src tests scripts analysis
      - name: unit + moto integration tests
        run: python -m pytest
      - name: terraform fmt + validate
        run: make tf-check
      - name: lambda package with the pinned sdk
        run: PY=python bash scripts/build_lambda.sh
      - name: citation check (offline part)
        run: python scripts/check_bib.py --offline
      - name: whole pipeline on moto (functional check)
        run: make functional PY=python
