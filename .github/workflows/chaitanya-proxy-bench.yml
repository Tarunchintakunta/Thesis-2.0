name: chaitanya-proxy-bench

# Runs the local process-start (init proxy) benchmark for all three runtimes on
# one GitHub-hosted machine and uploads the CSV. Started by hand only.
# The result is a proxy measurement, not AWS Lambda data.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: interleaved blocks (each block runs all six variants once)
        default: "40"

jobs:
  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaitanya-thesis/lambda-coldstart-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: chaitanya-thesis/lambda-coldstart-isolation/functions/java/*/pom.xml
      - run: pip install -r requirements.txt
      - run: PY=python bash scripts/package_all.sh
      - run: python scripts/check_digests.py --require python,nodejs,java
      - run: python scripts/local_init_bench.py --reps ${{ inputs.reps }} --out data/proxy/github
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-bench
          path: chaitanya-thesis/lambda-coldstart-isolation/data/proxy/github
