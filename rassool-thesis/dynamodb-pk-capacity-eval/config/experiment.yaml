# Factorial design - committed values from the master prompt (section 2).
# Changing anything here after the pilot needs a dated amendment in docs/ANALYSIS_PLAN.md.
project: dynamodb-pk-capacity
run_label: "ddbpk-eval"
region: eu-west-1
table_prefix: ddbpk

factors:
  key_design: [K1, K2, K3]
  capacity_mode: [on_demand, provisioned]
  workload: [W1, W2, W3, W4]     # rates and mixes in workloads/generator/profiles.py

replicates: 30                   # measured batches per configuration x workload (f = 0.25 at 80% power)
settling_seconds: 120            # load held at the profile's base rate before every measured batch
warmup_invocations: 2            # Lambda warm-up calls before every measured batch

dataset:
  orders: 1000000
  customers: 10000
  item_size_kb: 1

zipf:
  s: 1.070916                    # calibrated: hottest 10% of 1,000,000 keys get 90% of ops (top 1% get 78%)
  perm_seed: 20250920

k3_shards: 10                    # N for the write-sharded key

consistency: eventual            # GetItem default: 0.5 RCU per 4 KB

provisioned:                     # C2 - sized per key design by analysis/design_checks.py
  target_utilisation: 70         # auto-scaling target (%)
  sizing_profiles: [W1, W2, W3]  # min capacity covers the base rate of these at the target
  max_multiplier: 5              # auto-scaling max = 5 x min

driver:
  lambdas_per_batch: 4           # 1000 ops/s from one Python process would be GIL-bound
  threads_per_lambda: 32
  memory_mb: 1769
  sample_every: 1                # keep every operation record (raw CSV per batch)

schedule:
  blocks: 30                     # every block runs all 24 cells once in a new random order
  seed: 20250920

sensitivity:                     # item size, not part of the factorial
  item_sizes_kb: [1, 8, 32]
  configurations: best_and_worst # from the main campaign, decided by the rule in ANALYSIS_PLAN.md
  replicates: 10
  orders: 100000                 # separate key range s<kb>-..., loaded only into those two tables

abort:
  throttle_rate: 0.5             # stop a cell after this many batches in a row above 50% throttled
  consecutive_batches: 3
  daily_budget_usd: 25

analysis:
  alpha: 0.05
  reference_configuration: K1-on_demand   # "baseline" for the 10% latency threshold
  practical_latency_pct: 10
  practical_cost_pct: 5
  bootstrap: 2000
