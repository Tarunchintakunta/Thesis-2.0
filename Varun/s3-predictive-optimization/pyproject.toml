[project]
name = "s3-predictive-optimization"
version = "1.0.0"
description = "Predictive Storage Cost Optimization Framework for Amazon S3"
authors = [{name = "Varun Gampa", email = "X23398639@student.ncirl.ie"}]
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
