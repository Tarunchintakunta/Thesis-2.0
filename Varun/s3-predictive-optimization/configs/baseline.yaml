experiment:
  name: "baseline_tierbase"
  description: "TierBase-inspired rule-based recommendation baseline"
  mode: "dry_run"
  
workload:
  num_objects: 1000
  duration_days: 90
  access_patterns:
    - hot: 0.15
    - warm: 0.35
    - cold: 0.50
  size_distribution:
    mean_mb: 25
    std_mb: 15
    min_mb: 0.1
    max_mb: 500

recommendation:
  method: "baseline"
  baseline:
    age_threshold_ia: 30
    age_threshold_glacier_instant: 90
    age_threshold_glacier_deep: 180
    access_threshold_ia: 5
    access_threshold_glacier: 1
    size_threshold_kb: 128

forecasting:
  enabled: true
  method: "prophet"
  horizon_days: 30
  naive_baseline: true

evaluation:
  metrics:
    - allocation_accuracy
    - forecast_mape
    - forecast_rmse
    - cost_savings_usd
    - cost_savings_percent
  statistical_test: "wilcoxon"
  alpha: 0.05

output:
  results_dir: "results/data"
  figures_dir: "results/figures"
  save_raw: true
  save_audit_log: true
