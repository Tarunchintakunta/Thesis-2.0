AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  faultlab - order-processing microservice for the fault detection and localisation
  study. Synthetic data only. The telemetry condition (tracing on/off, sampling,
  log level) is chosen with the parameters.

Parameters:
  TracingMode:
    Type: String
    AllowedValues: [Active, PassThrough]
    Default: Active
  LogLevel:
    Type: String
    AllowedValues: [INFO, ERROR]
    Default: ERROR
  SamplingFixedRate:
    Type: Number
    Default: 0.05
    Description: X-Ray sampling rule fixed rate (1.0 = full tracing)
  SamplingReservoir:
    Type: Number
    Default: 1
    Description: X-Ray sampling rule reservoir (requests per second always traced)
  ClientTimeoutMs:
    Type: Number
    Default: 1000
    Description: deadline orders-api gives its synchronous dependencies
  AlertEmail:
    Type: String
    Default: ""
    Description: optional - monthly budget alert (empty = no budget)

Conditions:
  TracingOn: !Equals [!Ref TracingMode, Active]
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 5
    Tracing: !Ref TracingMode
    Layers: [!Ref FaultlabLayer]
    Environment:
      Variables:
        TABLE_NAME: !Ref OrdersTable
        FAULT_PARAM: !Ref FaultParameter
        LOG_LEVEL: !Ref LogLevel
        CLIENT_TIMEOUT_MS: !Ref ClientTimeoutMs
        FAULT_CACHE_S: "2"
        AWS_XRAY_SDK_ENABLED: !If [TracingOn, "true", "false"]
    Tags:
      project: faultlab
      managed_by: sam
      purpose: research-eval
      data: synthetic

Resources:
  FaultlabLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-faultlab
      Description: fault switch, logging, X-Ray patching, downstream calls
      ContentUri: src/layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      Tags:
        - Key: project
          Value: faultlab

  FaultParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/fault
      Type: String
      Value: "{}"
      Description: fault switch written by injector/injector.py

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: !If [TracingOn, true, false]

  OrdersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-orders-api
      CodeUri: src/orders_api/
      Handler: app.handler
      Environment:
        Variables:
          INVENTORY_FN: !Ref InventoryFunction
          PAYMENTS_FN: !Ref PaymentsFunction
          NOTIFICATIONS_FN: !Ref NotificationsFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/fault
        - LambdaInvokePolicy:
            FunctionName: !Ref InventoryFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PaymentsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationsFunction
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /orders
            Method: post
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /orders/{id}
            Method: get
        Cancel:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /orders/{id}/cancel
            Method: post

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-inventory
      CodeUri: src/inventory/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/fault

  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-payments
      CodeUri: src/payments/
      Handler: app.handler
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/fault

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-notifications
      CodeUri: src/notifications/
      Handler: app.handler
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/fault

  OrdersApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-orders-api
      RetentionInDays: 14
  InventoryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-inventory
      RetentionInDays: 14
  PaymentsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-payments
      RetentionInDays: 14
  NotificationsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-notifications
      RetentionInDays: 14

  # API Gateway takes the sampling decision and passes it down to the functions.
  # "*" matches every traced service in the account - use an account kept for the study.
  SamplingRule:
    Type: AWS::XRay::SamplingRule
    Condition: TracingOn
    Properties:
      SamplingRule:
        RuleName: !Sub ${AWS::StackName}-sampling
        Priority: 100
        FixedRate: !Ref SamplingFixedRate
        ReservoirSize: !Ref SamplingReservoir
        ServiceName: "*"
        ServiceType: "*"
        Host: "*"
        HTTPMethod: "*"
        URLPath: "*"
        ResourceARN: "*"
        Version: 1

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 20
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
  TableName:
    Value: !Ref OrdersTable
  FaultParameterName:
    Value: !Ref FaultParameter
  OrdersApiFunctionName:
    Value: !Ref OrdersApiFunction
