# Machine-readable half of docs/ANALYSIS_PLAN.md. Written before any live data.
# Changes after the freeze go into `amendments` with a date and a reason.
written: "2026-09-11, before any live data"
alpha: 0.05

# Holm-Bonferroni over these five together
confirmatory_family: [H1, H2_python, H2_nodejs, H2_java, H3]
# exploratory, Holm inside the family only, always reported as exploratory
exploratory_families:
  H4: [H4_python, H4_nodejs, H4_java]
  combined: [combined_python, combined_nodejs, combined_java]

reference_memory_mb: 1024
memory_contrast: [128, 1024]      # the "raise memory" row of the decision matrix

practical:
  min_init_saving_ms: 50          # below this a change is not worth making, whatever the p-value
  min_cold_fraction_drop: 0.10    # absolute drop in cold-start fraction for the warming row
  max_free_cost_usd_per_1k: 0.001 # "free" = adds at most $0.001 per 1,000 invocations

# per-1k cost needs a traffic mix: the share of invocations that are cold.
# Taken from the warm-control arm of the warming phase (sparse traffic, no warmer).
cold_fraction_source: warming_off

power:
  target_power: 0.80
  min_n_per_cell: 30
  mwu_are: 0.864                  # asymptotic relative efficiency of Mann-Whitney vs t
  min_effect_ms: 50               # = practical.min_init_saving_ms

amendments:
  - date: "2026-09-20"
    reason: >
      Live lite had no valid Init samples for python-bytecode (Unhandled on all 24
      invocations). H2 confirmatory contrast is default vs optimised for every runtime.
      Holm family was run on lite n=12 (H1/H2) and H3 n=3 blocks — underpowered vs
      min_n_per_cell 30; H3 did not reject. python-bytecode formally dropped from H2.
