# sam deploy --config-file infra/samconfig.toml   (scripts/deploy.sh passes the same values)
version = 0.1

[default.deploy.parameters]
stack_name = "coldstart-study"
region = "eu-west-1"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "MemorySize=1024 WarmingSchedule=\"rate(5 minutes)\" EnableTracing=false"
