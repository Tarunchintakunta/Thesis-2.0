AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Cold-start isolation research artefact.
  Python 3.12 / Node.js 20 / Java 21 x default / optimised package, plus a
  warming pair with a low-frequency EventBridge warmer. arm64 everywhere.
  No provisioned concurrency, no SnapStart (future work only).

Metadata:
  cfn-lint:
    config:
      # nodejs20.x is the runtime named in the proposal. AWS deprecated it on
      # 2026-04-30 but creating functions stays possible until 2027-02-01.
      # Kept on purpose, see docs/ASSUMPTIONS.md A3.
      ignore_checks: [W2531]

Parameters:
  MemorySize:
    Type: Number
    Default: 1024
    AllowedValues: [128, 256, 512, 1024, 1769, 2048, 3008]
    Description: Starting memory; the invokers change it per cell during a run.
  WarmingSchedule:
    Type: String
    Default: rate(5 minutes)
    AllowedPattern: "^rate\\(([5-9]|10) minutes\\)$"
    Description: Low-frequency warmer only (5-10 minutes).
  EnableTracing:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  Tracing: !Equals [!Ref EnableTracing, "true"]

Globals:
  Function:
    Architectures: [arm64]
    MemorySize: !Ref MemorySize
    Timeout: 30
    Tracing: !If [Tracing, Active, PassThrough]
    Environment:
      Variables:
        COLD_TOKEN: initial   # changed by the invoker to force new environments

Resources:
  # ---- Python 3.12 ---------------------------------------------------------------------
  PythonDefaultFunction:
    Type: AWS::Serverless::Function
    DependsOn: PythonDefaultLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-python-default"
      Runtime: python3.12
      Handler: handler.lambda_handler
      CodeUri: ../build/python-default.zip
  PythonDefaultLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-python-default"
      RetentionInDays: !Ref LogRetentionDays

  PythonOptimisedFunction:
    Type: AWS::Serverless::Function
    DependsOn: PythonOptimisedLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-python-optimised"
      Runtime: python3.12
      Handler: handler.lambda_handler
      CodeUri: ../build/python-optimised.zip
  PythonOptimisedLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-python-optimised"
      RetentionInDays: !Ref LogRetentionDays

  # ---- Node.js 20 ----------------------------------------------------------------------
  NodejsDefaultFunction:
    Type: AWS::Serverless::Function
    DependsOn: NodejsDefaultLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-nodejs-default"
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: ../build/nodejs-default.zip
  NodejsDefaultLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-nodejs-default"
      RetentionInDays: !Ref LogRetentionDays

  NodejsOptimisedFunction:
    Type: AWS::Serverless::Function
    DependsOn: NodejsOptimisedLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-nodejs-optimised"
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: ../build/nodejs-optimised.zip
  NodejsOptimisedLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-nodejs-optimised"
      RetentionInDays: !Ref LogRetentionDays

  # ---- Java 21 (Corretto) --------------------------------------------------------------
  JavaDefaultFunction:
    Type: AWS::Serverless::Function
    DependsOn: JavaDefaultLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-java-default"
      Runtime: java21
      Handler: coldstart.Handler::handleRequest
      CodeUri: ../build/java-default/function.jar
  JavaDefaultLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-java-default"
      RetentionInDays: !Ref LogRetentionDays

  JavaOptimisedFunction:
    Type: AWS::Serverless::Function
    DependsOn: JavaOptimisedLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-java-optimised"
      Runtime: java21
      Handler: coldstart.Handler::handleRequest
      CodeUri: ../build/java-optimised/function.jar
  JavaOptimisedLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-java-optimised"
      RetentionInDays: !Ref LogRetentionDays

  # ---- warming pair (H3): same code and memory, only the target has the rule ----------
  WarmTargetFunction:
    Type: AWS::Serverless::Function
    DependsOn: WarmTargetLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-warm-target"
      Runtime: python3.12
      Handler: handler.lambda_handler
      CodeUri: ../build/python-optimised.zip
      Events:
        Warmer:
          Type: Schedule
          Properties:
            Name: !Sub "${AWS::StackName}-warmer"
            Schedule: !Ref WarmingSchedule
            Input: '{"warmer": true}'
            State: DISABLED   # switched on by invoke_steady.py only during the warming phase
  WarmTargetLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-warm-target"
      RetentionInDays: !Ref LogRetentionDays

  WarmControlFunction:
    Type: AWS::Serverless::Function
    DependsOn: WarmControlLogs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-warm-control"
      Runtime: python3.12
      Handler: handler.lambda_handler
      CodeUri: ../build/python-optimised.zip
  WarmControlLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-warm-control"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  StackPrefix:
    Description: Function names are <prefix>-<runtime>-<variant>, plus -warm-target / -warm-control
    Value: !Ref AWS::StackName
  WarmerRule:
    Value: !Sub "${AWS::StackName}-warmer"
