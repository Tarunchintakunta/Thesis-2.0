name: Terraform scanner benchmark (no apply)

on:
  push:
    paths:
      - "vishvaksen-thesis/terraform-scanner-benchmark/**"
      - "vishvaksen-thesis/.github/workflows/policy-gate.yml"
  pull_request:
    paths:
      - "vishvaksen-thesis/terraform-scanner-benchmark/**"

jobs:
  corpus-and-opa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vishvaksen-thesis/terraform-scanner-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python deps
        run: pip install -r requirements.txt pytest
      - name: Generate labelled corpus
        run: python scripts/generate_corpus.py
      - name: Unit tests
        run: python -m pytest tests/ -q --tb=short
      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: OPA check + category eval sample
        run: |
          opa check policies/rego
          python scripts/run_opa.py
      - name: Refuse apply
        run: |
          echo "This workflow never runs terraform apply."
          test ! -f terraform.tfstate
