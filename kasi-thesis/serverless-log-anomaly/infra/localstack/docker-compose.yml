# LocalStack for the live (non-emulated) path.
#   docker compose -f infra/localstack/docker-compose.yml up -d
#   scripts/01_deploy_app.sh
# Image tag is pinned so the environment is reproducible.
services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: kasireddy-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=lambda,apigateway,dynamodb,logs,iam,sts,s3,cloudformation
      - DEBUG=0
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=60
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
