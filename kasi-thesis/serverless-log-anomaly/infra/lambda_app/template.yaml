AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Orders API used as the target system for the log anomaly detection study
  (MSc Cloud Computing, NCI). HTTP API -> Lambda (python3.11) -> DynamoDB.
  Deploy to LocalStack (samlocal) or to your own AWS account only.

Parameters:
  TableName:
    Type: String
    Default: kasireddy-orders
  FunctionName:
    Type: String
    Default: kasireddy-orders
  LogRetentionDays:
    Type: Number
    Default: 7

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.11
      Handler: handler.lambda_handler
      CodeUri: .
      MemorySize: 256
      Timeout: 3
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt OrdersTable.Arn
      Events:
        CreateOrder:
          Type: HttpApi
          Properties: {Path: /orders, Method: POST}
        ListOrders:
          Type: HttpApi
          Properties: {Path: /orders, Method: GET}
        GetOrder:
          Type: HttpApi
          Properties: {Path: "/orders/{id}", Method: GET}
        Health:
          Type: HttpApi
          Properties: {Path: /health, Method: GET}

  OrdersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OrdersFunction}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Value: !Ref OrdersFunction
  FunctionRoleName:
    Description: execution role (the permission_denied fault adds a deny policy to it)
    Value: !Ref OrdersFunctionRole
  TableName:
    Value: !Ref OrdersTable
  LogGroup:
    Value: !Ref OrdersLogGroup
