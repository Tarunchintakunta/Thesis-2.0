# Detector settings. Fixed before phase B is generated (no peeking).

features:
  # per-window numbers taken from the parsed REPORT / app lines
  numeric: [invocations, error_lines, p50_duration_ms, p99_duration_ms, max_mem_ratio, cold_starts, timeouts, killed]

d1_source_free:                # trained only on the certified-clean phase A windows
  # primary model for H1. Amended 2026-09-11 after the smoke/pilot run and before
  # the main collection: the first rule ("auto" = lowest validation false-alarm
  # rate) picked Isolation Forest, which barely alarms at all because it never
  # splits on features that were constant in clean training (e.g. the
  # never-seen-template counter). A rule that rewards silence is not a fair
  # choice, so the primary is fixed to the OC-SVM (novelty detection model, and
  # the one Ali et al. (2025) measured the label deficit for). Both are still
  # reported; the validation FAR of both is kept in results/run_info.json.
  primary: d1_ocsvm            # d1_ocsvm | d1_iforest | auto
  threshold_quantile: 0.99     # alarm threshold = this quantile of the model's training scores
  ocsvm: {kernel: rbf, gamma: scale, nu: 0.05}
  iforest: {n_estimators: 200, max_samples: auto, random_state: 0}

d2_transfer:                   # ELFA-Log style (Zhao et al., 2025), re-implemented
  source: bgl_2k               # data/external/loghub/BGL_2k.log (labelled per line)
  source_window_lines: 20
  source_step_lines: 10
  hashing_features: 1024       # shared semantic space: hashed words of the templates
  svd_components: 32
  coral_eps: 1.0               # covariance regulariser for CORAL alignment
  classifier: {C: 1.0, class_weight: balanced, max_iter: 2000}
  pseudo_label_rounds: 3
  entropy_threshold: 0.3       # nats; target windows below this become pseudo-labelled
  pseudo_weight: 0.5
  decision_threshold: 0.5
