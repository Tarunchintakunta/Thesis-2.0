# Main experiment. All times are simulated time on the emulator's virtual
# clock (or wall time in live mode), starting at start_utc.
name: main
seeds: [2025, 2026, 2027]      # each seed = one full A/B/C campaign
start_utc: "2026-06-01T00:00:00Z"
window_s: 60                   # detection windows (CloudWatch 1 minute periods)

workload:
  base_rate: 0.3               # requests / s averaged over a day
  diurnal_amplitude: 0.7
  route_mix:
    "POST /orders": 0.40
    "GET /orders/{id}": 0.35
    "GET /orders": 0.15
    "GET /health": 0.10

runtime:                       # the Lambda function + execution environments
  memory_mb: 256
  timeout_s: 3.0
  reserved_concurrency: 10
  idle_reclaim_s: [300, 900]
  max_env_lifetime_s: 7200
  cold_init_median_ms: 380
  cpu_median_ms: 4
  ws_mean_mb: 78               # working set of one invocation
  ws_sd_mb: 8

db:                            # DynamoDB as seen from the function
  latency_median_ms: 6
  latency_sigma: 0.35
  read_timeout_s: 2.0

faults:                        # Xie et al. (2025) aligned categories
  permission_denied: {ops: [PutItem]}
  config_error: {}
  dependency_timeout: {latency_factor: 8, p_timeout: 0.35, p_hang: 0.10, hang_s: 5.0}
  resource_exhaustion: {memory_mb: 128, ws_mean_mb: 118, ws_sd_mb: 10, gc_factor: 1.8}

phases:
  A:                           # certified-clean training period, no injections
    hours: 24
    bursts: {every_s: 7200, len_s: 120, factor: 10}
  B:                           # evaluation: normal traffic + scheduled injections
    injections_per_category: 60
    block_size: 12             # 3 of each category per block
    gap_s: [360, 720]          # normal traffic before each injection
    duration_s: [120, 240]     # length of one injection
    tail_s: 600
    bursts: {every_s: 7200, len_s: 120, factor: 10}
  C:                           # fault-free elasticity control (cold starts, scale-up)
    hours: 6
    bursts: {every_s: 1800, len_s: 180, factor: 40}

split:
  train_fraction: 0.8          # chronological inside phase A (Le and Zhang, 2022)
